<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugator Dashboard</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="dashboard">
    <header class="dash-header">
      <div class="dash-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <h1>Bugator</h1>
      </div>
      <span class="dash-count" id="totalCount">0 bugs</span>
    </header>

    <div class="dash-toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search bugs..." autocomplete="off" aria-label="Search bugs">
      </div>
      <div class="filter-row">
        <select id="filterUrl" class="filter-select" aria-label="Filter by page">
          <option value="">All Pages</option>
        </select>
        <select id="filterDate" class="filter-select" aria-label="Filter by date">
          <option value="">All Time</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
        </select>
      </div>
    </div>

    <div class="dash-list" id="bugList" role="list" aria-label="Bug reports">
      <p class="empty-state">No bugs yet. Start picking to report issues.</p>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
